services:
  db:
    image: pgvector/pgvector:pg16
    container_name: documind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: